<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14"/>
      <stop offset="50%" stop-color="#140f28"/>
      <stop offset="100%" stop-color="#080912"/>
    </linearGradient>
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="100%" stop-color="#55E6FF"/>
    </linearGradient>
    <linearGradient id="meterGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="100%" stop-color="#55E6FF"/>
    </linearGradient>
    <linearGradient id="meterGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55E6FF"/>
      <stop offset="100%" stop-color="#4EFA94"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B7BFF" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#55E6FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Matrix Grid -->
  <g opacity="0.12" stroke="#9B7BFF" stroke-width="0.8">
    <path d="M 0 60 H 800 M 0 120 H 800 M 0 180 H 800 M 0 240 H 800 M 0 300 H 800 M 0 360 H 800 M 0 420 H 800"/>
    <path d="M 80 0 V 480 M 160 0 V 480 M 240 0 V 480 M 320 0 V 480 M 400 0 V 480 M 480 0 V 480 M 560 0 V 480 M 640 0 V 480 M 720 0 V 480"/>
  </g>

  <!-- Center Aura -->
  <circle cx="280" cy="240" r="190" fill="url(#auraGlow)"/>

  <!-- Biometric Facial Mesh (Left/Center) -->
  <g transform="translate(280, 230)">
    <!-- Head Contour -->
    <path d="M -90 -100 C -90 -170, 90 -170, 90 -100 C 90 -10, 65 80, 0 120 C -65 80, -90 -10, -90 -100 Z"
          fill="rgba(155, 123, 255, 0.05)" stroke="url(#violetCyan)" stroke-width="2" filter="url(#glow)"/>

    <!-- Mesh Wireframe Polygons -->
    <!-- Forehead -->
    <polygon points="0,-140 -50,-100 0,-90 50,-100" fill="none" stroke="#55E6FF" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-140" x2="0" y2="-90" stroke="#9B7BFF" stroke-width="1" opacity="0.7"/>

    <!-- Eyes Mesh -->
    <!-- Left Eye -->
    <path d="M -60 -55 Q -40 -70 -20 -55 Q -40 -42 -60 -55 Z" fill="rgba(85, 230, 255, 0.2)" stroke="#55E6FF" stroke-width="1.8"/>
    <circle cx="-40" cy="-55" r="7" fill="#55E6FF" filter="url(#glow)"/>
    <circle cx="-40" cy="-55" r="2.5" fill="#090a14"/>
    <rect x="-70" y="-75" width="60" height="38" fill="none" stroke="#9B7BFF" stroke-width="1" stroke-dasharray="3 2" opacity="0.8"/>
    <text x="-68" y="-80" fill="#55E6FF" font-family="monospace" font-size="8" font-weight="bold">GAZE: 0.96</text>

    <!-- Right Eye -->
    <path d="M 20 -55 Q 40 -70 60 -55 Q 40 -42 20 -55 Z" fill="rgba(85, 230, 255, 0.2)" stroke="#55E6FF" stroke-width="1.8"/>
    <circle cx="40" cy="-55" r="7" fill="#55E6FF" filter="url(#glow)"/>
    <circle cx="40" cy="-55" r="2.5" fill="#090a14"/>
    <rect x="10" y="-75" width="60" height="38" fill="none" stroke="#9B7BFF" stroke-width="1" stroke-dasharray="3 2" opacity="0.8"/>
    <text x="12" y="-80" fill="#55E6FF" font-family="monospace" font-size="8" font-weight="bold">BLINK: NORMAL</text>

    <!-- Nose Bridge & Tip -->
    <polygon points="0,-90 -16,-10 0,5 16,-10" fill="none" stroke="#9B7BFF" stroke-width="1.2" opacity="0.7"/>
    <circle cx="0" cy="5" r="3" fill="#55E6FF"/>

    <!-- Mouth / Smile Detection -->
    <path d="M -40 45 Q 0 65 40 45 Q 0 85 -40 45 Z" fill="rgba(155, 123, 255, 0.25)" stroke="url(#violetCyan)" stroke-width="1.8"/>
    <line x1="-40" y1="45" x2="40" y2="45" stroke="#55E6FF" stroke-width="1.2"/>

    <!-- Key Landmark Dots -->
    <circle cx="-90" cy="-100" r="3" fill="#9B7BFF"/>
    <circle cx="90" cy="-100" r="3" fill="#9B7BFF"/>
    <circle cx="-75" cy="0" r="3" fill="#55E6FF"/>
    <circle cx="75" cy="0" r="3" fill="#55E6FF"/>
    <circle cx="-45" cy="70" r="3" fill="#9B7BFF"/>
    <circle cx="45" cy="70" r="3" fill="#9B7BFF"/>
    <circle cx="0" cy="120" r="4" fill="#55E6FF"/>

    <!-- Synaptic Connection Lines across Landmarks -->
    <line x1="-60" y1="-55" x2="-16" y2="-10" stroke="#55E6FF" stroke-width="0.8" opacity="0.5"/>
    <line x1="60" y1="-55" x2="16" y2="-10" stroke="#55E6FF" stroke-width="0.8" opacity="0.5"/>
    <line x1="-16" y1="-10" x2="-40" y2="45" stroke="#9B7BFF" stroke-width="0.8" opacity="0.5"/>
    <line x1="16" y1="-10" x2="40" y2="45" stroke="#9B7BFF" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Right HUD Analytics Panel -->
  <g transform="translate(510, 65)">
    <!-- Card Frame -->
    <rect width="250" height="350" rx="14" fill="rgba(14, 16, 28, 0.85)" stroke="rgba(155, 123, 255, 0.35)" stroke-width="1.5"/>
    <rect width="250" height="38" rx="14" fill="rgba(155, 123, 255, 0.12)"/>
    <circle cx="20" cy="19" r="4.5" fill="#4EFA94" filter="url(#glow)"/>
    <text x="32" y="23" fill="#F4F3FA" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">AFFECTIVE AI MONITOR</text>

    <!-- State Badges -->
    <g transform="translate(18, 55)">
      <text x="0" y="0" fill="#8E8BA7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Primary State</text>
      <rect x="0" y="8" width="120" height="24" rx="6" fill="rgba(85, 230, 255, 0.15)" stroke="#55E6FF" stroke-width="1"/>
      <text x="12" y="24" fill="#55E6FF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Deep Engagement</text>

      <rect x="130" y="8" width="84" height="24" rx="6" fill="rgba(155, 123, 255, 0.15)" stroke="#9B7BFF" stroke-width="1"/>
      <text x="142" y="24" fill="#9B7BFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Focus: High</text>
    </g>

    <!-- Emotion Metric Bars -->
    <g transform="translate(18, 120)">
      <!-- Metric 1: Attention -->
      <text x="0" y="0" fill="#F4F3FA" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Attentiveness</text>
      <text x="214" y="0" fill="#55E6FF" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">94.8%</text>
      <rect x="0" y="6" width="214" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="6" width="202" height="6" rx="3" fill="url(#meterGrad1)"/>

      <!-- Metric 2: Comprehension -->
      <text x="0" y="32" fill="#F4F3FA" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Cognitive Fluency</text>
      <text x="214" y="32" fill="#4EFA94" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">89.2%</text>
      <rect x="0" y="38" width="214" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="38" width="190" height="6" rx="3" fill="url(#meterGrad2)"/>

      <!-- Metric 3: Confusion (Low is good) -->
      <text x="0" y="64" fill="#F4F3FA" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Confusion / Fatigue</text>
      <text x="214" y="64" fill="#9B7BFF" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">8.4%</text>
      <rect x="0" y="70" width="214" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="70" width="18" height="6" rx="3" fill="#9B7BFF"/>
    </g>

    <!-- EEG / Brainwave Spectrogram Wave -->
    <g transform="translate(18, 226)">
      <text x="0" y="0" fill="#8E8BA7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Real-Time Synaptic Stream</text>
      <path d="M 0 25 Q 20 5, 35 25 T 70 25 T 105 10 T 140 38 T 175 25 T 214 25" fill="none" stroke="url(#violetCyan)" stroke-width="2" filter="url(#glow)"/>
    </g>

    <!-- Adaptive Curriculum Action Prompt -->
    <g transform="translate(18, 282)">
      <rect width="214" height="48" rx="8" fill="rgba(85, 230, 255, 0.08)" stroke="rgba(85, 230, 255, 0.3)" stroke-width="1"/>
      <text x="12" y="20" fill="#55E6FF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">ADAPTIVE ACTION:</text>
      <text x="12" y="35" fill="#F4F3FA" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">Accelerate Pace · Surface Quiz</text>
    </g>
  </g>

  <!-- Top-left Status Indicator -->
  <g transform="translate(40, 42)">
    <rect width="170" height="28" rx="14" fill="rgba(14, 16, 28, 0.75)" stroke="rgba(85, 230, 255, 0.35)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#55E6FF" filter="url(#glow)"/>
    <text x="28" y="18" fill="#55E6FF" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="0.8">OPENCV + CNN ACTIVE</text>
  </g>
</svg>

