<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c18"/>
      <stop offset="50%" stop-color="#140f29"/>
      <stop offset="100%" stop-color="#080911"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="100%" stop-color="#55E6FF"/>
    </linearGradient>
    <radialGradient id="agentAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55E6FF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#9B7BFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" rx="16" fill="url(#sdrBg)"/>

  <!-- Subtle grid -->
  <g opacity="0.12" stroke="#55E6FF" stroke-width="0.8">
    <path d="M 0 80 H 800 M 0 160 H 800 M 0 240 H 800 M 0 320 H 800 M 0 400 H 800"/>
    <path d="M 100 0 V 480 M 200 0 V 480 M 300 0 V 480 M 400 0 V 480 M 500 0 V 480 M 600 0 V 480 M 700 0 V 480"/>
  </g>

  <circle cx="400" cy="240" r="240" fill="url(#agentAura)"/>

  <!-- Top Application Window Bar -->
  <g transform="translate(60, 45)">
    <rect width="680" height="42" rx="10" fill="rgba(20, 22, 35, 0.9)" stroke="rgba(155, 123, 255, 0.3)" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="40" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="21" r="5" fill="#27C93F"/>
    <text x="85" y="26" fill="#F4F3FA" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">AI SDR AGENT · AUTONOMOUS OUTREACH SYSTEM</text>
    <rect x="540" y="10" width="124" height="22" rx="6" fill="rgba(85, 230, 255, 0.15)"/>
    <text x="555" y="25" fill="#55E6FF" font-family="monospace" font-size="11" font-weight="bold">AGENT ACTIVE</text>
  </g>

  <!-- Left: Lead Qualification Pipeline Flow -->
  <g transform="translate(60, 105)">
    <rect width="320" height="230" rx="14" fill="rgba(16, 18, 30, 0.85)" stroke="rgba(155, 123, 255, 0.25)" stroke-width="1.2"/>
    <text x="24" y="34" fill="#9B7BFF" font-family="sans-serif" font-size="13" font-weight="bold">AGENT WORKFLOW</text>

    <!-- Node 1 -->
    <rect x="24" y="56" width="272" height="42" rx="8" fill="rgba(155, 123, 255, 0.12)" stroke="rgba(155, 123, 255, 0.4)" stroke-width="1"/>
    <circle cx="44" cy="77" r="10" fill="#9B7BFF"/>
    <text x="40" y="81" fill="#08090D" font-family="sans-serif" font-size="11" font-weight="bold">1</text>
    <text x="64" y="73" fill="#F4F3FA" font-family="sans-serif" font-size="11" font-weight="bold">Prospect Discovery</text>
    <text x="64" y="88" fill="#9294A3" font-family="sans-serif" font-size="9">LinkedIn &amp; GitHub Profile Scraping</text>

    <!-- Connector arrow -->
    <line x1="160" y1="98" x2="160" y2="114" stroke="#55E6FF" stroke-width="2" stroke-dasharray="3 2"/>

    <!-- Node 2 -->
    <rect x="24" y="114" width="272" height="42" rx="8" fill="rgba(85, 230, 255, 0.12)" stroke="rgba(85, 230, 255, 0.4)" stroke-width="1"/>
    <circle cx="44" cy="135" r="10" fill="#55E6FF"/>
    <text x="40" y="139" fill="#08090D" font-family="sans-serif" font-size="11" font-weight="bold">2</text>
    <text x="64" y="131" fill="#F4F3FA" font-family="sans-serif" font-size="11" font-weight="bold">ICP Qualification &amp; Scoring</text>
    <text x="64" y="146" fill="#55E6FF" font-family="sans-serif" font-size="9">Match Score: 94.6% · High Priority</text>

    <!-- Connector arrow -->
    <line x1="160" y1="156" x2="160" y2="172" stroke="#9B7BFF" stroke-width="2" stroke-dasharray="3 2"/>

    <!-- Node 3 -->
    <rect x="24" y="172" width="272" height="42" rx="8" fill="rgba(155, 123, 255, 0.16)" stroke="rgba(155, 123, 255, 0.5)" stroke-width="1"/>
    <circle cx="44" cy="193" r="10" fill="url(#accentGrad)"/>
    <text x="40" y="197" fill="#08090D" font-family="sans-serif" font-size="11" font-weight="bold">3</text>
    <text x="64" y="189" fill="#F4F3FA" font-family="sans-serif" font-size="11" font-weight="bold">Contextual AI Email Pitch</text>
    <text x="64" y="204" fill="#9294A3" font-family="sans-serif" font-size="9">LLM Multi-Turn Reasoning Generator</text>
  </g>

  <!-- Right: Generated Outreach Preview & Metrics -->
  <g transform="translate(400, 105)">
    <rect width="340" height="230" rx="14" fill="rgba(16, 18, 30, 0.85)" stroke="rgba(85, 230, 255, 0.25)" stroke-width="1.2"/>
    <text x="24" y="34" fill="#55E6FF" font-family="sans-serif" font-size="13" font-weight="bold">AGENT OUTPUT INSIGHTS</text>

    <!-- Metric Badges -->
    <g transform="translate(24, 52)">
      <rect width="90" height="50" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="12" y="22" fill="#9294A3" font-family="sans-serif" font-size="9">Sent Mails</text>
      <text x="12" y="42" fill="#F4F3FA" font-family="sans-serif" font-size="16" font-weight="bold">1,420</text>

      <rect x="100" y="0" width="90" height="50" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(85, 230, 255, 0.3)"/>
      <text x="112" y="22" fill="#9294A3" font-family="sans-serif" font-size="9">Open Rate</text>
      <text x="112" y="42" fill="#55E6FF" font-family="sans-serif" font-size="16" font-weight="bold">78.4%</text>

      <rect x="200" y="0" width="90" height="50" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(155, 123, 255, 0.3)"/>
      <text x="212" y="22" fill="#9294A3" font-family="sans-serif" font-size="9">Reply Rate</text>
      <text x="212" y="42" fill="#9B7BFF" font-family="sans-serif" font-size="16" font-weight="bold">34.2%</text>
    </g>

    <!-- Terminal Prompt / Reasoning Trace -->
    <rect x="24" y="118" width="292" height="92" rx="8" fill="#080911" stroke="rgba(85, 230, 255, 0.2)"/>
    <text x="36" y="138" fill="#55E6FF" font-family="monospace" font-size="10">&gt; Thought: Analyzed prospect tech stack</text>
    <text x="36" y="156" fill="#9B7BFF" font-family="monospace" font-size="10">&gt; Prompt: Synthesizing value proposition...</text>
    <text x="36" y="174" fill="#00E676" font-family="monospace" font-size="10">&gt; Status: 200 OK · Dispatched to Outreach</text>
    <text x="36" y="192" fill="#F4F3FA" font-family="monospace" font-size="9" opacity="0.7">&gt; Confidence Score: 0.982 [Optimal]</text>
  </g>

  <!-- Bottom Tech Stack Pill Row -->
  <g transform="translate(60, 360)">
    <rect width="680" height="70" rx="14" fill="rgba(16, 18, 30, 0.9)" stroke="url(#accentGrad)" stroke-width="1.2"/>
    
    <g transform="translate(30, 42)">
      <circle cx="0" cy="-6" r="6" fill="#55E6FF"/>
      <text x="14" y="-2" fill="#F4F3FA" font-family="sans-serif" font-size="12" font-weight="bold">LANGCHAIN / LLM AGENTS</text>
    </g>

    <g transform="translate(250, 42)">
      <circle cx="0" cy="-6" r="6" fill="#9B7BFF"/>
      <text x="14" y="-2" fill="#F4F3FA" font-family="sans-serif" font-size="12" font-weight="bold">PYTHON FASTAPI BACKEND</text>
    </g>

    <g transform="translate(480, 42)">
      <circle cx="0" cy="-6" r="6" fill="#55E6FF"/>
      <text x="14" y="-2" fill="#F4F3FA" font-family="sans-serif" font-size="12" font-weight="bold">REACT.JS / NODE ARCHITECTURE</text>
    </g>
  </g>
</svg>

