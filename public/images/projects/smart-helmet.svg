<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121024"/>
      <stop offset="100%" stop-color="#080910"/>
    </linearGradient>
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="100%" stop-color="#55E6FF"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55E6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9B7BFF" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="helmetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B7BFF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#55E6FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid Matrix Pattern -->
  <g opacity="0.15" stroke="#9B7BFF" stroke-width="0.8">
    <path d="M 0 60 H 800 M 0 120 H 800 M 0 180 H 800 M 0 240 H 800 M 0 300 H 800 M 0 360 H 800 M 0 420 H 800"/>
    <path d="M 80 0 V 480 M 160 0 V 480 M 240 0 V 480 M 320 0 V 480 M 400 0 V 480 M 480 0 V 480 M 560 0 V 480 M 640 0 V 480 M 720 0 V 480"/>
  </g>

  <!-- Central Ambient Aura -->
  <circle cx="400" cy="240" r="220" fill="url(#helmetGlow)"/>

  <!-- Futuristic Smart Helmet Shell / Visor Wireframe -->
  <g transform="translate(400, 220)">
    <!-- Helmet Outer Contour -->
    <path d="M -130 -40 C -130 -140, 130 -140, 130 -40 C 130 30, 90 100, 40 120 L -40 120 C -90 100, -130 30, -130 -40 Z" 
          fill="rgba(155, 123, 255, 0.08)" stroke="url(#violetCyan)" stroke-width="2.5" filter="url(#glow)"/>

    <!-- HUD Visor Curved Geometry -->
    <path d="M -105 -15 C -105 -75, 105 -75, 105 -15 C 105 25, 60 55, 0 55 C -60 55, -105 25, -105 -15 Z" 
          fill="rgba(85, 230, 255, 0.15)" stroke="#55E6FF" stroke-width="2"/>

    <!-- Visor Scanlines & Target Reticle -->
    <line x1="-80" y1="-15" x2="80" y2="-15" stroke="#55E6FF" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
    <circle cx="0" cy="-15" r="24" fill="none" stroke="#55E6FF" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="-15" r="4" fill="#55E6FF"/>
    <path d="M -32 -15 H -20 M 20 -15 H 32 M 0 -32 V -20 M 0 20 V 32" stroke="#55E6FF" stroke-width="1.8"/>

    <!-- Computer Vision Bounding Boxes -->
    <rect x="-95" y="-55" width="45" height="35" fill="none" stroke="#9B7BFF" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="-90" y="-45" fill="#55E6FF" font-family="monospace" font-size="7" font-weight="bold">EYE: TRACK</text>
    <rect x="50" y="-55" width="45" height="35" fill="none" stroke="#9B7BFF" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="55" y="-45" fill="#55E6FF" font-family="monospace" font-size="7" font-weight="bold">DROWSINESS: 0%</text>
  </g>

  <!-- Left HUD Sensor Telemetry Module -->
  <g transform="translate(60, 90)">
    <rect width="210" height="130" rx="12" fill="rgba(17, 19, 28, 0.85)" stroke="rgba(155, 123, 255, 0.3)" stroke-width="1.2"/>
    <rect x="16" y="18" width="8" height="8" rx="2" fill="#55E6FF"/>
    <text x="32" y="26" fill="#F4F3FA" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">OPENCV VISION</text>
    
    <text x="16" y="55" fill="#9294A3" font-family="monospace" font-size="10">Face Mesh Tracking</text>
    <text x="16" y="75" fill="#55E6FF" font-family="monospace" font-size="12" font-weight="bold">ACTIVE · 60 FPS</text>

    <!-- Signal pulse waveform -->
    <path d="M 16 102 L 50 102 L 60 88 L 72 114 L 84 94 L 95 102 L 190 102" fill="none" stroke="#55E6FF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right HUD Module: Embedded Telemetry & Crash Guard -->
  <g transform="translate(530, 90)">
    <rect width="210" height="130" rx="12" fill="rgba(17, 19, 28, 0.85)" stroke="rgba(85, 230, 255, 0.3)" stroke-width="1.2"/>
    <rect x="16" y="18" width="8" height="8" rx="2" fill="#9B7BFF"/>
    <text x="32" y="26" fill="#F4F3FA" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">RASPBERRY PI &amp; IOT</text>
    
    <text x="16" y="55" fill="#9294A3" font-family="monospace" font-size="10">Alcohol Sensing</text>
    <text x="16" y="75" fill="#9B7BFF" font-family="monospace" font-size="12" font-weight="bold">MQ-3: SAFE [0.00% BAC]</text>

    <text x="16" y="100" fill="#9294A3" font-family="monospace" font-size="10">Accident Detection: IMU 6-DOF OK</text>
  </g>

  <!-- Bottom Real-Time Telemetry Bar -->
  <g transform="translate(180, 380)">
    <rect width="440" height="60" rx="30" fill="rgba(17, 19, 28, 0.9)" stroke="url(#violetCyan)" stroke-width="1.4"/>
    
    <g transform="translate(30, 36)">
      <circle cx="0" cy="-6" r="6" fill="#00E676" filter="url(#glow)"/>
      <text x="16" y="-2" fill="#F4F3FA" font-family="sans-serif" font-size="12" font-weight="bold">SYSTEM ONLINE</text>
    </g>

    <g transform="translate(195, 36)">
      <text x="0" y="-2" fill="#55E6FF" font-family="monospace" font-size="11" font-weight="bold">BLUETOOTH 5.0 LE</text>
    </g>

    <g transform="translate(330, 36)">
      <text x="0" y="-2" fill="#9B7BFF" font-family="monospace" font-size="11" font-weight="bold">TENSORFLOW LITE</text>
    </g>
  </g>
</svg>

