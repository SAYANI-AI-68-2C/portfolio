<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="aromaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d16"/>
      <stop offset="50%" stop-color="#181326"/>
      <stop offset="100%" stop-color="#090a12"/>
    </linearGradient>
    <linearGradient id="goldViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="50%" stop-color="#55E6FF"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <radialGradient id="culinaryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#9B7BFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#aromaBg)"/>

  <!-- Subtle star & ambiance -->
  <circle cx="400" cy="240" r="230" fill="url(#culinaryGlow)"/>

  <!-- Browser Frame -->
  <g transform="translate(60, 40)">
    <rect width="680" height="390" rx="14" fill="rgba(16, 18, 30, 0.95)" stroke="rgba(155, 123, 255, 0.3)" stroke-width="1.2"/>
    
    <!-- Window Bar -->
    <rect width="680" height="42" rx="14" fill="rgba(24, 27, 44, 0.8)"/>
    <circle cx="22" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="38" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="54" cy="21" r="5" fill="#27C93F"/>
    
    <!-- Search / URL Pill -->
    <rect x="80" y="9" width="340" height="24" rx="12" fill="rgba(8, 9, 13, 0.6)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="96" y="25" fill="#9294A3" font-family="monospace" font-size="11">https://aroma-restaurant.io/menu</text>

    <!-- Top Navigation Inside App -->
    <g transform="translate(450, 26)">
      <text x="0" y="0" fill="#F4F3FA" font-family="sans-serif" font-size="11" font-weight="600">Home</text>
      <text x="46" y="0" fill="#55E6FF" font-family="sans-serif" font-size="11" font-weight="600">Menu</text>
      <text x="96" y="0" fill="#F4F3FA" font-family="sans-serif" font-size="11" font-weight="600">Reservations</text>
      <rect x="180" y="-14" width="36" height="20" rx="10" fill="url(#goldViolet)"/>
      <text x="190" y="0" fill="#08090D" font-family="sans-serif" font-size="10" font-weight="bold">Book</text>
    </g>

    <!-- Hero Culinary Presentation -->
    <g transform="translate(40, 75)">
      <!-- Left Hero Banner -->
      <text x="0" y="32" fill="#55E6FF" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2">AUTHENTIC FLAVORS</text>
      <text x="0" y="68" fill="#F4F3FA" font-family="Georgia, serif" font-size="30" font-weight="bold">Savor the Essence</text>
      <text x="0" y="100" fill="#FFD166" font-family="Georgia, serif" font-size="28" font-style="italic">of Culinary Art.</text>
      
      <text x="0" y="132" fill="#9294A3" font-family="sans-serif" font-size="12">Experience exquisite gourmet dining curated by master chefs.</text>
      <text x="0" y="150" fill="#9294A3" font-family="sans-serif" font-size="12">Interactive menus, real-time table booking &amp; chef specials.</text>

      <rect x="0" y="176" width="130" height="38" rx="19" fill="url(#goldViolet)"/>
      <text x="24" y="200" fill="#08090D" font-family="sans-serif" font-size="12" font-weight="bold">Explore Menu →</text>
    </g>

    <!-- Right Featured Dish Card -->
    <g transform="translate(420, 70)">
      <rect width="220" height="220" rx="16" fill="rgba(24, 27, 44, 0.7)" stroke="rgba(255, 209, 102, 0.3)" stroke-width="1.2"/>
      
      <!-- Gourmet Dish Illustration -->
      <circle cx="110" cy="95" r="55" fill="rgba(255, 209, 102, 0.15)" stroke="#FFD166" stroke-width="2"/>
      <circle cx="110" cy="95" r="42" fill="rgba(155, 123, 255, 0.2)"/>
      <!-- Food plate garnish styling -->
      <path d="M 85 95 Q 110 70 135 95 Q 110 120 85 95 Z" fill="#FFD166" opacity="0.9"/>
      <circle cx="110" cy="95" r="8" fill="#55E6FF"/>
      <circle cx="95" cy="88" r="4" fill="#00E676"/>
      <circle cx="125" cy="102" r="4" fill="#FF5F56"/>

      <text x="18" y="175" fill="#F4F3FA" font-family="sans-serif" font-size="13" font-weight="bold">Truffle Herb Risotto</text>
      <text x="18" y="195" fill="#9294A3" font-family="sans-serif" font-size="11">Wild mushroom, aged parmesan</text>
      <text x="18" y="215" fill="#55E6FF" font-family="sans-serif" font-size="13" font-weight="bold">$28.00</text>
    </g>

    <!-- Bottom Features Showcase Bar -->
    <g transform="translate(40, 310)">
      <rect width="600" height="52" rx="10" fill="rgba(8, 9, 13, 0.5)" stroke="rgba(255, 255, 255, 0.08)"/>
      
      <g transform="translate(24, 32)">
        <text x="0" y="0" fill="#FFD166" font-family="sans-serif" font-size="12" font-weight="bold">✦ Table Reservation API</text>
      </g>
      <g transform="translate(210, 32)">
        <text x="0" y="0" fill="#55E6FF" font-family="sans-serif" font-size="12" font-weight="bold">✦ Responsive Food Gallery</text>
      </g>
      <g transform="translate(410, 32)">
        <text x="0" y="0" fill="#9B7BFF" font-family="sans-serif" font-size="12" font-weight="bold">✦ Modern JavaScript/React</text>
      </g>
    </g>
  </g>
</svg>

