<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121026"/>
      <stop offset="100%" stop-color="#080911"/>
    </linearGradient>
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="100%" stop-color="#55E6FF"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55E6FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#9B7BFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="bookSpine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="100%" stop-color="#6F4AFF"/>
    </linearGradient>
    <linearGradient id="bookSpine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55E6FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="bookSpine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9B7BFF"/>
    </linearGradient>
    <radialGradient id="libGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55E6FF" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#9B7BFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Matrix Grid -->
  <g opacity="0.12" stroke="#9B7BFF" stroke-width="0.8">
    <path d="M 0 60 H 800 M 0 120 H 800 M 0 180 H 800 M 0 240 H 800 M 0 300 H 800 M 0 360 H 800 M 0 420 H 800"/>
    <path d="M 80 0 V 480 M 160 0 V 480 M 240 0 V 480 M 320 0 V 480 M 400 0 V 480 M 480 0 V 480 M 560 0 V 480 M 640 0 V 480 M 720 0 V 480"/>
  </g>

  <!-- Center Aura -->
  <circle cx="280" cy="240" r="200" fill="url(#libGlow)"/>

  <!-- 3D Isometric / Futuristic Bookshelf & RFID Scan Zone (Left/Center) -->
  <g transform="translate(140, 130)">
    <!-- Base Platform Glow -->
    <ellipse cx="140" cy="220" rx="150" ry="24" fill="rgba(85, 230, 255, 0.12)" filter="url(#glow)"/>

    <!-- Bookshelf Shelf Line -->
    <rect x="-10" y="195" width="300" height="8" rx="4" fill="rgba(155, 123, 255, 0.25)" stroke="#9B7BFF" stroke-width="1"/>

    <!-- Book 1 (Slanted Left) -->
    <g transform="translate(20, 25) rotate(-10)">
      <rect x="0" y="0" width="38" height="170" rx="5" fill="url(#bookSpine1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="8" y1="20" x2="30" y2="20" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
      <line x1="8" y1="30" x2="24" y2="30" stroke="#FFF" stroke-width="1" opacity="0.6"/>
      <rect x="10" y="125" width="18" height="24" fill="rgba(0,0,0,0.3)" rx="2"/>
      <line x1="14" y1="130" x2="24" y2="130" stroke="#55E6FF" stroke-width="1.5"/>
      <line x1="14" y1="135" x2="24" y2="135" stroke="#55E6FF" stroke-width="1.5"/>
      <line x1="14" y1="140" x2="24" y2="140" stroke="#55E6FF" stroke-width="1.5"/>
    </g>

    <!-- Book 2 (Upright Active Scanned Book) -->
    <g transform="translate(75, 10)">
      <rect x="0" y="0" width="48" height="185" rx="5" fill="url(#bookSpine2)" stroke="#55E6FF" stroke-width="2" filter="url(#glow)"/>
      <text x="24" y="90" fill="#090A14" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" transform="rotate(-90 24 90)" letter-spacing="1.5">AI &amp; ML SYSTEMS</text>
      <!-- RFID Chip Tag on Spine -->
      <circle cx="24" cy="155" r="9" fill="rgba(9, 10, 20, 0.6)" stroke="#FFF" stroke-width="1.2"/>
      <path d="M 19 155 Q 24 150 29 155 M 20 159 Q 24 155 28 159" fill="none" stroke="#55E6FF" stroke-width="1.2"/>
      <circle cx="24" cy="155" r="2" fill="#55E6FF"/>
    </g>

    <!-- Book 3 (Next) -->
    <g transform="translate(135, 30)">
      <rect x="0" y="0" width="42" height="165" rx="5" fill="url(#bookSpine3)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="8" y1="20" x2="34" y2="20" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
      <line x1="8" y1="30" x2="28" y2="30" stroke="#FFF" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Book 4 -->
    <g transform="translate(188, 45)">
      <rect x="0" y="0" width="36" height="150" rx="5" fill="rgba(85, 230, 255, 0.2)" stroke="#55E6FF" stroke-width="1"/>
      <line x1="8" y1="20" x2="28" y2="20" stroke="#55E6FF" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- Book 5 (Tilted Right) -->
    <g transform="translate(240, 48) rotate(14)">
      <rect x="0" y="0" width="34" height="148" rx="5" fill="url(#bookSpine1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    </g>

    <!-- RFID Scanner Beam Cone hitting Book 2 -->
    <polygon points="99,-35 60,195 138,195" fill="url(#laserBeam)" opacity="0.65"/>
    <line x1="99" y1="-35" x2="99" y2="195" stroke="#55E6FF" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="99" cy="-35" r="8" fill="#55E6FF" filter="url(#glow)"/>
    <circle cx="99" cy="-35" r="3" fill="#FFF"/>

    <!-- RFID Waves Broadcasting -->
    <path d="M 75 -20 Q 99 -10 123 -20" fill="none" stroke="#55E6FF" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.9"/>
    <path d="M 60 -5 Q 99 8 138 -5" fill="none" stroke="#9B7BFF" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8"/>

    <!-- Barcode Scan Laser Line Overlay -->
    <line x1="68" y1="110" x2="130" y2="110" stroke="#FF4A75" stroke-width="2" filter="url(#glow)"/>
    <circle cx="68" cy="110" r="2.5" fill="#FF4A75"/>
    <circle cx="130" cy="110" r="2.5" fill="#FF4A75"/>
  </g>

  <!-- Right HUD Dashboard Card -->
  <g transform="translate(490, 60)">
    <!-- Main Frame -->
    <rect width="270" height="360" rx="14" fill="rgba(14, 16, 28, 0.88)" stroke="rgba(85, 230, 255, 0.35)" stroke-width="1.5"/>
    <rect width="270" height="40" rx="14" fill="rgba(85, 230, 255, 0.1)"/>
    <circle cx="20" cy="20" r="4.5" fill="#55E6FF" filter="url(#glow)"/>
    <text x="34" y="24" fill="#F4F3FA" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">SMART LIBRARY RFID HUD</text>

    <!-- Real-time Scan Status Badge -->
    <g transform="translate(18, 56)">
      <rect width="234" height="60" rx="10" fill="rgba(85, 230, 255, 0.08)" stroke="rgba(85, 230, 255, 0.25)" stroke-width="1"/>
      <text x="14" y="22" fill="#8E8BA7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-transform="uppercase">Scanned Tag UID</text>
      <text x="14" y="44" fill="#55E6FF" font-family="monospace" font-size="14" font-weight="700">RFID-868-UEM-9042</text>
      <rect x="180" y="14" width="44" height="18" rx="4" fill="rgba(78, 250, 148, 0.2)" stroke="#4EFA94" stroke-width="1"/>
      <text x="188" y="26" fill="#4EFA94" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">VALID</text>
    </g>

    <!-- Item Metadata Fields -->
    <g transform="translate(18, 134)">
      <!-- Field 1 -->
      <text x="0" y="0" fill="#8E8BA7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">TITLE:</text>
      <text x="64" y="0" fill="#F4F3FA" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">AI &amp; Neural Architecture</text>
      
      <!-- Field 2 -->
      <text x="0" y="22" fill="#8E8BA7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">AUTHOR:</text>
      <text x="64" y="22" fill="#9B7BFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Dept. CSE (AI-ML)</text>

      <!-- Field 3 -->
      <text x="0" y="44" fill="#8E8BA7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">ACTION:</text>
      <text x="64" y="44" fill="#4EFA94" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Auto-Borrow Authorized</text>

      <!-- Field 4 -->
      <text x="0" y="66" fill="#8E8BA7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">DUE DATE:</text>
      <text x="64" y="66" fill="#F4F3FA" font-family="monospace" font-size="11" font-weight="500">14 Days · No Overdue Fine</text>
    </g>

    <!-- System Metrics / Counters -->
    <g transform="translate(18, 226)">
      <rect width="110" height="52" rx="8" fill="rgba(155, 123, 255, 0.1)" stroke="rgba(155, 123, 255, 0.3)" stroke-width="1"/>
      <text x="12" y="18" fill="#8E8BA7" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">CATALOG TOTAL</text>
      <text x="12" y="40" fill="#9B7BFF" font-family="monospace" font-size="16" font-weight="700">14,850+</text>

      <rect x="124" y="0" width="110" height="52" rx="8" fill="rgba(85, 230, 255, 0.1)" stroke="rgba(85, 230, 255, 0.3)" stroke-width="1"/>
      <text x="136" y="18" fill="#8E8BA7" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">RFID SYNC</text>
      <text x="136" y="40" fill="#55E6FF" font-family="monospace" font-size="16" font-weight="700">100.0%</text>
    </g>

    <!-- Footer IoT status -->
    <g transform="translate(18, 300)">
      <rect width="234" height="42" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="14" cy="21" r="4" fill="#4EFA94" filter="url(#glow)"/>
      <text x="26" y="18" fill="#F4F3FA" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">IEDC TechEd IoT Node</text>
      <text x="26" y="32" fill="#8E8BA7" font-family="monospace" font-size="9">UEM Kolkata · Active 24/7</text>
    </g>
  </g>

  <!-- Top-left RFID Protocol Status -->
  <g transform="translate(40, 42)">
    <rect width="180" height="28" rx="14" fill="rgba(14, 16, 28, 0.75)" stroke="rgba(85, 230, 255, 0.35)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#55E6FF" filter="url(#glow)"/>
    <text x="28" y="18" fill="#55E6FF" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="0.8">RFID 868MHz + IOT</text>
  </g>
</svg>

